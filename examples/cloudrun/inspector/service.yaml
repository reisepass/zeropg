apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: zeropg-inspector
  labels:
    zeropg-tool: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"        # scale to zero - it is an admin tool
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: blob-pglite-dev@blob-pglite.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        # ---- ingress: token gate + landing + replica wires + adminer proxy ----
        - name: app
          image: europe-west1-docker.pkg.dev/blob-pglite/zeropg/zeropg-inspector:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ZEROPG_BUCKET
              value: "zeropg-experiments-euw1"
            - name: INSPECTOR_MAX_OPEN
              value: "3"
            - name: INSPECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inspector-token
                  key: latest
            # generated by deploy.sh from `zeropg fleet ls`
            - name: INSPECTOR_TARGETS
              valueFrom:
                secretKeyRef:
                  name: inspector-targets
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15

        # ---- adminer sidecar (auto-login build), loopback :8081 ----
        - name: adminer
          image: europe-west1-docker.pkg.dev/blob-pglite/zeropg/zeropg-inspector-adminer:latest
          env:
            - name: PGSSLMODE
              value: "disable"
            - name: ZEROPG_LINK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inspector-token
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
  traffic:
    - percent: 100
      latestRevision: true
